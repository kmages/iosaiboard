name: iOSAIBoard
options:
  bundleIdPrefix: com.kmages
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: 93S652CWXH
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  iOSAIBoard:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: iOSAIBoard
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmages.iosaiboard
    dependencies:
      - target: iOSAIBoardKeyboard
    scheme: {}
  iOSAIBoardKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: iOSAIBoard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmages.iosaiboard.keyboard
